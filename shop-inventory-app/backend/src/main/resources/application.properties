spring.application.name=shop-inventory

# --- Supabase Postgres connection ---
# Never hardcode credentials here. Set these as real environment variables
# (see backend/.env.example and README "Supabase setup").
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created/seeded by sql/schema.sql ourselves, so Hibernate
# should only validate the mapping matches, never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- CORS ---
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- Business rules ---
# Reorder threshold: a LowStock event fires whenever a reserve() leaves a
# product's stock below this number.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

server.port=${SERVER_PORT:8080}
