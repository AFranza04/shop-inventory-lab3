# --- CORS ---
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- Business rules ---
# Reorder threshold: a LowStock event fires whenever a reserve() leaves a
# product's stock below this number.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

legacysupply.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
legacysupply.client-id=${LS_CLIENT_ID}
legacysupply.api-key=${LS_API_KEY}

spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=15000

server.port=${SERVER_PORT:8080}
